name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  release:
    name: ${{ matrix.target }}
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/tasker${{ matrix.ext }}" \
             "dist/tasker-${{ matrix.target }}${{ matrix.ext }}"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Tasker ${{ github.ref_name }}
          body: |
            Tasker ${{ github.ref_name }} — the "Pro" release.

            - Due date-times with **Due today** / **Missed due** sections and a launch toast
            - Multiple **tags** per task with an `f` filter
            - Live per-task **timer** (`w`), `H:MM` totals that survive restarts
            - **CLI** companion: `add` / `done` / `list` / `export --format json|markdown`
            - **Amber-phosphor** theme across the whole interface
            - One local SQLite file; no accounts, no network, no server
          files: dist/*
