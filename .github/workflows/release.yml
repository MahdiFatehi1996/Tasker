name: Verify & Release

# The repository's only workflow. Three jobs, each gating the next:
#
#   verify   fmt + clippy + test on Linux and Windows
#   build    release binary for every supported target, uploaded as artifacts
#   release  checksums + build provenance + GitHub Release
#
# Triggers:
#   push tag v*        verify -> build -> publish   (this is how a release ships)
#   push to main       verify only
#   workflow_dispatch  verify; build+release too when dispatched with dry_run,
#                      or against a tag ref (gh workflow run release.yml --ref v0.2.0)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build every target and run every check, but skip publishing the release.
        type: boolean
        default: false

# Read-only by default; the release job widens its own scope.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rustflags: ""
          - os: windows-latest
            # Mirrors the release build so every push tests the binary that
            # actually ships: a static CRT, which keeps the .exe from needing
            # the Visual C++ Redistributable at runtime.
            rustflags: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo test --locked
      - name: Shell installer parses (bash)
        shell: bash
        run: |
          set -euo pipefail
          bash -n packaging/installer/tasker-install.sh
          echo "tasker-install.sh: bash -n OK"
      # The script declares #!/usr/bin/env sh, so hold it to POSIX sh and not
      # just to bash. Ubuntu's sh is dash, which is stricter than bash.
      - name: Shell installer parses (POSIX sh)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sh -n packaging/installer/tasker-install.sh
          echo "tasker-install.sh: sh -n OK"
      - name: PowerShell installer parses
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/packaging/installer/tasker-install.ps1",
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { $_.ToString() }
            exit 1
          }
          Write-Host "tasker-install.ps1: parse OK"
      # Download the newest release for real: platform detection, checksum
      # verification, extraction and install all have to work on this runner.
      # On Ubuntu `sh` is dash, so this also executes the script as POSIX sh.
      - name: Installer runs end to end
        shell: bash
        run: |
          set -euo pipefail
          target="$(mktemp -d)/bin"
          sh packaging/installer/tasker-install.sh --dir "$target"
          echo "--- installed ---"
          ls -l "$target"
          # `tasker` on POSIX, `tasker.exe` under Git Bash.
          test -e "$target/tasker" || test -e "$target/tasker.exe"

  build:
    name: ${{ matrix.target }}
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.dry_run == true }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            # Static CRT: without it the shipped .exe imports VCRUNTIME140.dll
            # and refuses to start on a Windows machine with no VC++ Redist.
            rustflags: "-C target-feature=+crt-static"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            rustflags: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            rustflags: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            rustflags: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage binary and archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist stage
          cp "target/${{ matrix.target }}/release/tasker${{ matrix.ext }}" \
             "stage/tasker${{ matrix.ext }}"
          # Raw binary, kept so existing download URLs keep working.
          cp "stage/tasker${{ matrix.ext }}" \
             "dist/tasker-${{ matrix.target }}${{ matrix.ext }}"
          # Archive, for package managers and plain downloads.
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            powershell -NoProfile -Command \
              "Compress-Archive -Path 'stage/tasker.exe' -DestinationPath 'dist/tasker-${{ matrix.target }}.zip' -Force"
          else
            tar -czf "dist/tasker-${{ matrix.target }}.tar.gz" -C stage "tasker"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: tasker-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: release ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign the build provenance
      attestations: write # store the attestations
    steps:
      # The installer scripts are not build outputs; take them from the tag so
      # they land in dist/ alongside the binaries and get picked up by the
      # `tasker-*` globs below (checksums + attestation).
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Stage installer scripts
        shell: bash
        run: |
          set -euo pipefail
          cp packaging/installer/tasker-install.sh \
             packaging/installer/tasker-install.ps1 \
             dist/
          ls -l dist
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum tasker-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "### Checksums"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/tasker-*
      - name: Publish release
        if: ${{ inputs.dry_run != true }}
        uses: softprops/action-gh-release@v3
        with:
          name: Tasker ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Offline, keyboard-driven daily task manager for the terminal: single binary, local SQLite, no network.
            Verify a download against `SHA256SUMS.txt`, or use `gh attestation verify <file> --repo MahdiFatehi1996/Tasker`.
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
